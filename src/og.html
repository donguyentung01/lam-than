<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;800&family=Lora:ital,wght@1,600&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#efe6d2;font-family:"Be Vietnam Pro",sans-serif;color:#221d17;text-transform:lowercase;overflow:hidden;position:relative}
.l{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.brand{display:flex;align-items:center;gap:16px;font-family:Lora,Georgia,serif;font-style:italic;font-weight:600;font-size:40px;color:#b0392a}
.brand img{width:64px;height:64px}
h1{margin:0;font-weight:800;font-size:68px;line-height:1.05;letter-spacing:-.02em}
h1 em{font-family:Lora,Georgia,serif;font-weight:600;color:#b0392a}
p{margin:0;font-size:26px;color:#6d6250;line-height:1.4}
.url{font-size:22px;font-weight:500;color:#b0392a}
.g{position:absolute;right:64px;top:50%;transform:translateY(-50%) rotate(-3deg);display:grid;grid-template-columns:repeat(2,230px);gap:18px}
.g img{width:230px;height:230px;border-radius:16px;border:1.5px solid rgba(34,29,23,.35);box-shadow:0 12px 30px rgba(70,50,25,.18)}
</style></head><body>
<div class="l">
  <div class="brand"><img src="icon-512.png">làm thân</div>
  <h1>càng hỏi,<br><em>càng thân.</em></h1>
  <p>bộ câu hỏi để hiểu nhau hơn.</p>
  <div class="url">lamthan.vercel.app</div>
</div>
<div class="g" id="g"></div>
<script src="sketch.js"></script>
<script>["yeu","ban","tien","triet"].forEach(id=>{const i=new Image();i.src=VG(id,460,460);document.getElementById("g").append(i)});</script>
</body></html>
